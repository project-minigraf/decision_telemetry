name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: java/**/pom.xml
      - name: Build, test and install (the demo steps resolve modules from the local repo)
        run: mvn -B -ntp install
      - name: Run the demo (writes .graph runs through minigraf-jvm and diffs them)
        run: mvn -B -ntp -q -pl trail-demo exec:java
      - name: CLI reads the demo runs
        run: |
          CP="trail-runtime/target/classes:$(mvn -B -ntp -q -pl trail-demo dependency:build-classpath -Dmdep.outputFile=/dev/stdout)"
          java -cp "$CP" io.github.adityamukho.trail.cli.TrailCli runs trail-demo/target/decision-telemetry-demo
          java -cp "$CP" io.github.adityamukho.trail.cli.TrailCli runs trail-demo/target/decision-telemetry-demo --json
